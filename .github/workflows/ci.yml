name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Checks
        run: ./scripts/check.sh

  solomon-aws-product-plan:
    name: Solomon AWS Product Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check v2 corpus contract
        run: node scripts/check-solomon-v2-corpus-contract.mjs

      - name: Check native directional eval
        run: node scripts/check-solomon-native-directional-eval-smoke.mjs

      - name: Check generative eval provenance
        run: node scripts/check-solomon-generative-eval-provenance.mjs

      - name: Check AWS product plan
        run: bash scripts/check-solomon-aws-product-plan.sh

      - name: Check product diagnostic wrapper
        run: node scripts/check-solomon-product-diagnostic.mjs --fast

  pages-results:
    name: Pages Results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check results generator
        run: node --check scripts/build-pages-results.mjs

      - name: Check generative eval provenance harness
        run: |
          node --check scripts/run-solomon-generative-eval.mjs
          node --check scripts/run-solomon-oracle-condition-diagnostic.mjs
          node --check scripts/score-solomon-generative-eval-retrieval.mjs
          node --check scripts/check-solomon-generative-eval-provenance.mjs
          node --check scripts/lib/solomon-symbolic-image.mjs
          node scripts/check-solomon-generative-eval-provenance.mjs

      - name: Check browser model compatibility
        run: node scripts/check-solomon-attention-web-model-self-test.mjs

      - name: Check model launch protocol
        run: |
          node --check scripts/lib/model-launch-v1.mjs
          node --check scripts/publish-model-launch.mjs
          node --check scripts/check-model-launch-v1.mjs
          node --check scripts/build-model-launch-site.mjs
          node --check scripts/lib/model-localnet-v1.mjs
          node --check scripts/lib/model-localnet-demo-v1.mjs
          node --check scripts/nsrl-model-localnet.mjs
          node --check scripts/check-model-localnet-v1.mjs
          node --check scripts/build-model-localnet-site.mjs
          node --check web/launches/app.js
          node scripts/check-model-launch-v1.mjs
          node scripts/build-model-launch-site.mjs --check
          node scripts/check-model-localnet-v1.mjs
          node scripts/build-model-localnet-site.mjs --check

      - name: Check fixed sample gallery
        run: |
          node scripts/generate-solomon-results-samples.mjs
          git diff --exit-code -- docs/solomon-sample-gallery.tsv docs/assets/results-samples

      - name: Build guarded results
        run: node scripts/build-pages-results.mjs --out-dir /tmp/nsrl-pages-results
