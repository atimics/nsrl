name: Deploy Solomon Web Sampler

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/web-pages.yml"
      - "docs/assets/**"
      - "docs/solomon-*.tsv"
      - "data/processed/nsrl-mme-v0.json"
      - "protocol/**"
      - "scripts/build-model-launch-site.mjs"
      - "scripts/build-model-localnet-site.mjs"
      - "scripts/build-model-market-site.mjs"
      - "scripts/build-pages-results.mjs"
      - "scripts/check-model-launch-v1.mjs"
      - "scripts/check-model-localnet-v1.mjs"
      - "scripts/check-model-market-v1.mjs"
      - "scripts/check-solomon-attention-web-model-self-test.mjs"
      - "scripts/lib/model-launch-v1.mjs"
      - "scripts/lib/model-localnet-demo-v1.mjs"
      - "scripts/lib/model-market-demo-v1.mjs"
      - "scripts/lib/model-localnet-v1.mjs"
      - "scripts/nsrl-model-localnet.mjs"
      - "scripts/check-solomon-attention-web-quality.mjs"
      - "scripts/probe-solomon-attention-body-start-rank.mjs"
      - "scripts/probe-solomon-attention-raw-rank.mjs"
      - "web/**"
      - "crates/nsrl-web-wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser model compatibility
        run: node scripts/check-solomon-attention-web-model-self-test.mjs

      - name: Check model launch protocol
        run: |
          node scripts/check-model-launch-v1.mjs
          node scripts/build-model-launch-site.mjs --check
          node scripts/check-model-localnet-v1.mjs
          node scripts/build-model-localnet-site.mjs --check
          node scripts/check-model-market-v1.mjs
          node scripts/build-model-market-site.mjs --check

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build WASM (Solomon sampler)
        run: |
          wasm-pack build crates/nsrl-web-wasm --release --target web --out-dir ../../web/pkg
          rm -f web/pkg/.gitignore

      - name: Build published results
        run: node scripts/build-pages-results.mjs --out-dir web/results

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static Solomon sampler
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
