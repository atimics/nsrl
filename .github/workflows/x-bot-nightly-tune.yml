name: Nightly Tune Crowley Bard X Bot

on:
  workflow_dispatch:
    inputs:
      tune_day:
        description: "UTC day to tune, YYYY-MM-DD. Defaults to yesterday."
        required: false
        type: string
      publish:
        description: "Publish candidate bundle and redeploy when the gate passes"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  FUNCTION_NAME: ${{ vars.X_BOT_FUNCTION_NAME || 'crowley-bard-mention-bot' }}
  ROLE_NAME: ${{ vars.X_BOT_LAMBDA_ROLE_NAME || 'crowley-bard-mention-bot-role' }}
  POLICY_NAME: ${{ vars.X_BOT_LAMBDA_POLICY_NAME || 'crowley-bard-mention-bot-policy' }}
  STATE_TABLE: ${{ vars.X_BOT_STATE_TABLE || 'crowley-bard-mention-state' }}
  SECRET_NAME: ${{ vars.X_BOT_SECRET_NAME || 'crowley-bard/x-api' }}
  RULE_NAME: ${{ vars.X_BOT_RULE_NAME || 'crowley-bard-mention-poll' }}
  SCHEDULE_EXPRESSION: ${{ vars.X_BOT_SCHEDULE_EXPRESSION || 'rate(15 minutes)' }}
  LAMBDA_ARCHITECTURE: arm64
  X_DRY_RUN: "true"
  X_DRY_RUN_ADVANCE_STATE: ${{ vars.X_BOT_DRY_RUN_ADVANCE_STATE || 'true' }}
  X_CONTEXT_ADAPT: "false"
  X_REPLY_ENGINE: nsrl-live
  X_CONTEXT_ARCHIVE_S3_URI: ${{ vars.X_BOT_CONTEXT_ARCHIVE_S3_URI }}
  X_BOT_MODEL_S3_URI: ${{ vars.X_BOT_MODEL_S3_URI }}
  X_BOT_MODEL_HISTORY_S3_URI: ${{ vars.X_BOT_MODEL_HISTORY_S3_URI || '' }}
  X_BOT_NIGHTLY_MAX_WINDOWS: ${{ vars.X_BOT_NIGHTLY_MAX_WINDOWS || '512' }}
  X_BOT_NIGHTLY_LR_SHIFT: ${{ vars.X_BOT_NIGHTLY_LR_SHIFT || '23' }}
  X_BOT_NIGHTLY_MAX_LR_SHIFT: ${{ vars.X_BOT_NIGHTLY_MAX_LR_SHIFT || '25' }}
  X_BOT_NIGHTLY_CONTEXT_REPEAT_COUNT: ${{ vars.X_BOT_NIGHTLY_CONTEXT_REPEAT_COUNT || '2' }}
  X_BOT_NIGHTLY_MIN_CONTEXT_EVENTS: ${{ vars.X_BOT_NIGHTLY_MIN_CONTEXT_EVENTS || '1' }}
  X_BOT_NIGHTLY_MIN_PASSING_SAMPLES: ${{ vars.X_BOT_NIGHTLY_MIN_PASSING_SAMPLES || '2' }}
  X_NSRL_MAX_NEW_TOKENS: ${{ vars.X_BOT_NSRL_MAX_NEW_TOKENS || '48' }}
  X_NSRL_TOP_K: ${{ vars.X_BOT_NSRL_TOP_K || '12' }}
  X_NSRL_TIMEOUT_SECONDS: ${{ vars.X_BOT_NSRL_TIMEOUT_SECONDS || '12' }}
  X_MAX_MENTIONS_PER_POLL: ${{ vars.X_BOT_MAX_MENTIONS_PER_POLL || '10' }}
  X_MAX_REPLIES_PER_RUN: ${{ vars.X_BOT_MAX_REPLIES_PER_RUN || '1' }}
  X_MAX_REPLIES_PER_15M: ${{ vars.X_BOT_MAX_REPLIES_PER_15M || '1' }}
  X_MAX_REPLIES_PER_DAY: ${{ vars.X_BOT_MAX_REPLIES_PER_DAY || '10' }}
  X_MAX_REPLIES_PER_MONTH: ${{ vars.X_BOT_MAX_REPLIES_PER_MONTH || '100' }}

jobs:
  nightly-tune:
    name: Tune and Deploy Candidate
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: crowley-bard-x-bot-nightly-tune
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build NSRL tools
        run: cargo build --release -p nsrl-train -p nsrl-corpus

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Nightly tune candidate
        id: tune
        env:
          X_BOT_TUNE_DAY: ${{ github.event_name == 'workflow_dispatch' && inputs.tune_day || '' }}
          X_BOT_NIGHTLY_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || 'true' }}
          NSRL_TRAIN_BIN: target/release/nsrl-train
          NSRL_CORPUS_BIN: target/release/nsrl-corpus
        run: scripts/x-bot/nightly-tune.sh

      - name: Package tuned Lambda
        if: steps.tune.outputs.published == 'true'
        env:
          X_BOT_LAMBDA_BIN: target/release/nsrl-train
          X_BOT_LAMBDA_CORPUS_BIN: target/release/nsrl-corpus
          X_BOT_MODEL_DIR: ${{ steps.tune.outputs.candidate_dir }}
        run: |
          set -euo pipefail
          scripts/x-bot/package.sh
          unzip -l scripts/x-bot/build/crowley-bard-mention-lambda.zip

      - name: Deploy tuned Lambda
        if: steps.tune.outputs.published == 'true'
        env:
          X_BOT_LAMBDA_BIN: target/release/nsrl-train
          X_BOT_LAMBDA_CORPUS_BIN: target/release/nsrl-corpus
          X_BOT_MODEL_DIR: ${{ steps.tune.outputs.candidate_dir }}
        run: scripts/x-bot/deploy.sh

      - name: Smoke tuned model
        if: steps.tune.outputs.published == 'true'
        run: |
          set -euo pipefail
          aws lambda invoke \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"test_generate":"@CrowleyBard what did the timeline dream overnight?","username":"nightly_smoke","id":"nightly-424242"}' \
            /tmp/crowley-bard-nightly-smoke.json
          cat /tmp/crowley-bard-nightly-smoke.json

      - name: No candidate
        if: steps.tune.outputs.published != 'true'
        run: echo "No nightly model was published."
