<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solomon | NSRL AI Model</title>
    <meta
      name="description"
      content="Solomon is the NSRL AI model for text-conditioned seal sampling in the browser."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell" aria-labelledby="site-title">
      <section class="stage">
        <div class="hud" aria-live="polite">
          <div>
            <p class="eyebrow">NSRL AI MODEL</p>
            <h1 id="site-title">Solomon</h1>
          </div>
          <div class="meters" aria-label="Solomon model state">
            <span id="statusPill">Loading</span>
            <span id="targetPill">Target -</span>
            <span id="scorePill">Score -</span>
          </div>
        </div>

        <section class="oracle" aria-live="polite" aria-label="Current sample">
          <canvas
            id="sigilCanvas"
            class="sigil-canvas"
            width="192"
            height="192"
            aria-label="Current Solomon sample"
          ></canvas>
          <p id="oracleText">Loading Solomon.</p>
        </section>

        <form class="command" id="sampleForm">
          <input
            id="promptInput"
            name="prompt"
            autocomplete="off"
            maxlength="280"
            placeholder="Prompt Solomon"
            disabled
          />
          <button id="sampleButton" type="submit" disabled>Sample</button>
        </form>

        <div class="controls" aria-label="Solomon sampling controls">
          <label>
            <span>Candidates</span>
            <input id="candidateSlider" type="range" min="1" max="16" step="1" value="4" />
          </label>
          <label>
            <span>Passes</span>
            <input id="passSlider" type="range" min="1" max="8" step="1" value="3" />
          </label>
          <label>
            <span>Conditions</span>
            <input id="conditionSlider" type="range" min="4" max="64" step="4" value="24" />
          </label>
          <button id="resetButton" type="button">Reset</button>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
