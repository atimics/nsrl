<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Forge six-atom experiment social card</title>
  <desc id="desc">Six atoms enter. Every claim gets tested. Sixty-four combinations, 8,192 exact forwards, candidate rejected, open challenge.</desc>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9ff57" stop-opacity="0.16" />
      <stop offset="0.48" stop-color="#c9ff57" stop-opacity="0" />
      <stop offset="1" stop-color="#8c96ff" stop-opacity="0.14" />
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#343930" stroke-width="1" stroke-dasharray="3 6" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0c0f0c" />
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.56" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <path d="M34 70V34H70M1130 34H1166V70M34 560V596H70M1130 596H1166V560" fill="none" stroke="#c9ff57" stroke-width="3" />

  <text x="62" y="78" fill="#aeb5a7" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="4">NSRL</text>
  <text x="137" y="78" fill="#f2f2e9" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" letter-spacing="2">FORGE</text>
  <text x="965" y="74" fill="#c9ff57" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1">OPEN CHALLENGE</text>

  <text x="62" y="177" fill="#f2f2e9" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800" letter-spacing="-2">SIX ATOMS ENTER.</text>
  <text x="62" y="239" fill="#c9ff57" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800" letter-spacing="-1.5">EVERY CLAIM GETS TESTED.</text>

  <g transform="translate(65 292)" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="800" text-anchor="middle">
    <path d="M44 44H564" stroke="#596051" stroke-width="2" stroke-dasharray="5 8" />
    <g fill="#141912" stroke="#c9ff57" stroke-width="3">
      <circle cx="44" cy="44" r="40" /><circle cx="148" cy="44" r="40" />
      <circle cx="252" cy="44" r="40" /><circle cx="356" cy="44" r="40" />
      <circle cx="460" cy="44" r="40" /><circle cx="564" cy="44" r="40" />
    </g>
    <g fill="#c9ff57">
      <text x="44" y="52">1</text><text x="148" y="52">2</text>
      <text x="252" y="52">3</text><text x="356" y="52">4</text>
      <text x="460" y="52">5</text><text x="564" y="52">6</text>
    </g>
  </g>

  <g transform="translate(62 420)" font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect width="325" height="104" rx="12" fill="#171b16" stroke="#3b4237" />
      <text x="22" y="34" fill="#90978a" font-size="15" font-weight="700" letter-spacing="1.2">COMBINATIONS</text>
      <text x="22" y="81" fill="#f2f2e9" font-family="Menlo, Consolas, monospace" font-size="39" font-weight="800">64</text>
    </g>
    <g transform="translate(344 0)">
      <rect width="325" height="104" rx="12" fill="#171b16" stroke="#3b4237" />
      <text x="22" y="34" fill="#90978a" font-size="15" font-weight="700" letter-spacing="1.2">EXACT FORWARDS</text>
      <text x="22" y="81" fill="#f2f2e9" font-family="Menlo, Consolas, monospace" font-size="39" font-weight="800">8,192</text>
    </g>
    <g transform="translate(688 0)">
      <rect width="388" height="104" rx="12" fill="#241914" stroke="#ff8b5d" stroke-opacity="0.68" />
      <text x="22" y="34" fill="#d9a38d" font-size="15" font-weight="700" letter-spacing="1.2">CHECKED OUTCOME</text>
      <text x="22" y="78" fill="#ffad8d" font-size="27" font-weight="800">CANDIDATE REJECTED</text>
    </g>
  </g>

  <text x="62" y="576" fill="#b7bdb1" font-family="Arial, Helvetica, sans-serif" font-size="19">Not a breakthrough claim. A reproducible next question.</text>
  <text x="1138" y="576" fill="#c9ff57" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="700" text-anchor="end">atimics.github.io/nsrl/launches</text>
</svg>
