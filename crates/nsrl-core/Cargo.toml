[package]
name = "nsrl-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
path = "src/lib.rs"
bench = false

[features]
default = []
std = []

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "attention"
harness = false

[[bench]]
name = "linear"
harness = false

