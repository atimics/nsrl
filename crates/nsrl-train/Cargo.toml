[package]
name = "nsrl-train"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "nsrl-train"

[dependencies]
nsrl-core = { path = "../nsrl-core", optional = true }
nsrl-corpus = { path = "../nsrl-corpus" }
nsrl-eval = { path = "../nsrl-eval" }
nsrl-train-core = { path = "../nsrl-train-core", optional = true }

[features]
default = ["core-runtime"]
core-runtime = ["dep:nsrl-core", "dep:nsrl-train-core"]
mini-heads-8 = ["core-runtime", "nsrl-train-core/mini-heads-8"]
mini-calibrated = ["core-runtime", "nsrl-train-core/mini-calibrated"]
