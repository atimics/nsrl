[package]
name = "nsrl-web-wasm"
version = "0.1.0"
edition.workspace = true
# Explicit (not workspace-inherited): wasm-pack's manifest parser rejects
# `license.workspace = true`.
license = "MIT OR Apache-2.0"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
console_error_panic_hook = "0.1"
nsrl-corpus = { path = "../nsrl-corpus" }
nsrl-train = { path = "../nsrl-train" }
wasm-bindgen = "0.2"
