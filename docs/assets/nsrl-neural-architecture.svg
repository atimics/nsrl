<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">NSRL NSRLLMM1 neural architecture</title>
  <desc id="desc">A diagram of the integer-native multimodal causal mini-transformer. A joint byte-token stream is embedded, passed through two transformer blocks with two-head base-2 causal attention and a gated MLP, then projected to next-token probabilities.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0a1526"/>
      <stop offset="1" stop-color="#0d182b"/>
    </linearGradient>
    <linearGradient id="inputFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123d51"/>
      <stop offset="1" stop-color="#102b42"/>
    </linearGradient>
    <linearGradient id="attentionFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263a6b"/>
      <stop offset="1" stop-color="#17284d"/>
    </linearGradient>
    <linearGradient id="mlpFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b285e"/>
      <stop offset="1" stop-color="#322044"/>
    </linearGradient>
    <linearGradient id="outputFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174c43"/>
      <stop offset="1" stop-color="#11362f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000814" flood-opacity="0.38"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#77d2e8"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#71839f"/>
    </marker>

    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill: #77d2e8; font-size: 17px; font-weight: 700; letter-spacing: 3px; }
      .title { fill: #f4f8ff; font-size: 42px; font-weight: 750; letter-spacing: -0.8px; }
      .subtitle { fill: #9eacc2; font-size: 18px; font-weight: 450; }
      .section { fill: #dce8fb; font-size: 20px; font-weight: 700; }
      .label { fill: #edf4ff; font-size: 17px; font-weight: 650; }
      .small { fill: #aebbd0; font-size: 14px; font-weight: 480; }
      .tiny { fill: #93a3bb; font-size: 12px; font-weight: 500; letter-spacing: 0.2px; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .pill { fill: #0c1a2c; stroke: #2b425f; stroke-width: 1; }
      .node { stroke-width: 1.4; }
      .line { fill: none; stroke: #77d2e8; stroke-width: 2.3; marker-end: url(#arrow); }
      .line-muted { fill: none; stroke: #71839f; stroke-width: 1.8; marker-end: url(#arrowMuted); }
      .residual { fill: none; stroke: #f3bf63; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .divider { stroke: #263750; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>
  <circle cx="1430" cy="80" r="230" fill="#17314e" opacity="0.18"/>
  <circle cx="80" cy="1050" r="260" fill="#193b46" opacity="0.14"/>

  <!-- Header -->
  <text x="90" y="72" class="eyebrow">NSRL · NSRLLMM1</text>
  <text x="90" y="122" class="title">Integer-native multimodal Transformer</text>
  <text x="90" y="158" class="subtitle">Current promoted-small trunk · causal next-token modeling over one joint text + image-token stream</text>

  <g transform="translate(1174 64)">
    <rect width="336" height="92" rx="18" fill="#0b192a" stroke="#263c58"/>
    <text x="22" y="30" class="tiny">MODEL PROFILE</text>
    <text x="22" y="58" class="label mono">d=128 · 2 heads · dₕ=64</text>
    <text x="22" y="79" class="small mono">MLP=256 · layers=2 · i8/i16</text>
  </g>

  <!-- Stage labels -->
  <g transform="translate(90 206)">
    <rect class="pill" width="196" height="32" rx="16"/>
    <text x="98" y="21" class="tiny" text-anchor="middle">1 · TOKENIZE + EMBED</text>
  </g>
  <g transform="translate(448 206)">
    <rect class="pill" width="700" height="32" rx="16"/>
    <text x="350" y="21" class="tiny" text-anchor="middle">2 · TWO-BLOCK INTEGER TRANSFORMER TRUNK</text>
  </g>
  <g transform="translate(1260 206)">
    <rect class="pill" width="250" height="32" rx="16"/>
    <text x="125" y="21" class="tiny" text-anchor="middle">3 · PREDICT NEXT TOKEN</text>
  </g>

  <!-- Input stream -->
  <g filter="url(#shadow)">
    <rect x="90" y="280" width="286" height="176" rx="22" fill="url(#inputFill)" stroke="#2d7185" class="node"/>
  </g>
  <text x="116" y="315" class="section">Joint byte-token stream</text>
  <g transform="translate(116 338)">
    <rect width="52" height="30" rx="8" fill="#0d2435" stroke="#2d7185"/>
    <rect x="58" width="80" height="30" rx="8" fill="#0d2435" stroke="#2d7185"/>
    <rect x="144" width="54" height="30" rx="8" fill="#0d2435" stroke="#2d7185"/>
    <rect x="204" width="56" height="30" rx="8" fill="#0d2435" stroke="#2d7185"/>
    <text x="26" y="20" class="tiny mono" text-anchor="middle">BOS</text>
    <text x="98" y="20" class="tiny mono" text-anchor="middle">PROMPT</text>
    <text x="171" y="20" class="tiny mono" text-anchor="middle">TEXT</text>
    <text x="232" y="20" class="tiny mono" text-anchor="middle">IMAGE</text>
  </g>
  <text x="116" y="397" class="small">Task markers, UTF-8 bytes, and</text>
  <text x="116" y="420" class="small">coarse symbolic 16×16 image tokens</text>
  <text x="116" y="443" class="tiny mono">vocabulary: 256 byte values</text>

  <!-- Embedding merge -->
  <path d="M 233 456 L 233 500" class="line"/>
  <g filter="url(#shadow)">
    <rect x="90" y="510" width="286" height="151" rx="22" fill="#102739" stroke="#3d7184" class="node"/>
  </g>
  <text x="116" y="544" class="section">Embedding sum</text>
  <g transform="translate(116 565)">
    <rect width="112" height="46" rx="11" fill="#16354a" stroke="#36758c"/>
    <rect x="126" width="134" height="46" rx="11" fill="#16354a" stroke="#36758c"/>
    <text x="56" y="20" class="label" text-anchor="middle">Token</text>
    <text x="56" y="37" class="tiny mono" text-anchor="middle">256 × 128</text>
    <text x="193" y="20" class="label" text-anchor="middle">Position</text>
    <text x="193" y="37" class="tiny mono" text-anchor="middle">context × 128</text>
  </g>
  <circle cx="233" cy="632" r="13" fill="#19394d" stroke="#77d2e8"/>
  <path d="M 226 632 h 14 M 233 625 v 14" stroke="#d8f6ff" stroke-width="1.8"/>
  <text x="253" y="638" class="tiny mono">Q15 / i16 residual stream</text>

  <!-- Input to block -->
  <path d="M 376 586 C 406 586 414 586 444 586" class="line"/>

  <!-- Detailed repeated block -->
  <g filter="url(#shadow)">
    <rect x="448" y="264" width="700" height="702" rx="28" fill="#0b1728" stroke="#344866" stroke-width="1.6"/>
  </g>
  <g transform="translate(476 286)">
    <rect width="148" height="34" rx="17" fill="#17344b" stroke="#3c7085"/>
    <text x="74" y="23" class="label mono" text-anchor="middle">BLOCK × 2</text>
    <text x="168" y="23" class="small">stacked residual trunk</text>
  </g>

  <!-- Attention sublayer -->
  <text x="480" y="361" class="section">A · Base-2 causal self-attention</text>
  <rect x="480" y="383" width="636" height="258" rx="20" fill="url(#attentionFill)" stroke="#506aa1" class="node"/>

  <rect x="504" y="410" width="112" height="58" rx="12" fill="#101e36" stroke="#546d9f"/>
  <text x="560" y="435" class="label" text-anchor="middle">Pre-norm slot</text>
  <text x="560" y="456" class="tiny" text-anchor="middle">identity today</text>

  <path d="M 616 439 L 650 439" class="line"/>
  <g>
    <rect x="650" y="399" width="102" height="44" rx="10" fill="#1c2b50" stroke="#667cb2"/>
    <rect x="650" y="453" width="102" height="44" rx="10" fill="#1c2b50" stroke="#667cb2"/>
    <rect x="650" y="507" width="102" height="44" rx="10" fill="#1c2b50" stroke="#667cb2"/>
    <text x="701" y="426" class="label" text-anchor="middle">Q projection</text>
    <text x="701" y="480" class="label" text-anchor="middle">K projection</text>
    <text x="701" y="534" class="label" text-anchor="middle">V projection</text>
    <text x="701" y="572" class="tiny mono" text-anchor="middle">i8 weights · 128→128</text>
  </g>

  <path d="M 752 421 C 782 421 776 454 800 454" class="line-muted"/>
  <path d="M 752 475 L 800 475" class="line-muted"/>
  <path d="M 752 529 C 782 529 776 496 800 496" class="line-muted"/>

  <rect x="800" y="410" width="156" height="124" rx="14" fill="#1a2a4b" stroke="#667cb2"/>
  <text x="878" y="436" class="label" text-anchor="middle">2 attention heads</text>
  <text x="878" y="458" class="small mono" text-anchor="middle">64 dims / head</text>
  <line x1="820" y1="473" x2="936" y2="473" class="divider"/>
  <text x="878" y="495" class="tiny" text-anchor="middle">causal QKᵀ · shift by 6</text>
  <text x="878" y="516" class="tiny" text-anchor="middle">native 2ˣ softmax · Q15</text>

  <path d="M 956 472 L 982 472" class="line"/>
  <rect x="982" y="421" width="110" height="102" rx="14" fill="#1c2b50" stroke="#667cb2"/>
  <text x="1037" y="449" class="label" text-anchor="middle">Weighted V</text>
  <text x="1037" y="471" class="tiny" text-anchor="middle">concatenate heads</text>
  <line x1="997" y1="484" x2="1077" y2="484" class="divider"/>
  <text x="1037" y="506" class="tiny mono" text-anchor="middle">O: 128→128</text>

  <path d="M 1037 523 L 1037 567 L 952 567" class="line"/>
  <circle cx="924" cy="567" r="18" fill="#3f3728" stroke="#f3bf63" stroke-width="1.5"/>
  <path d="M 916 567 h 16 M 924 559 v 16" stroke="#fff2cb" stroke-width="2"/>
  <text x="924" y="608" class="tiny" text-anchor="middle">raw residual add</text>
  <path d="M 504 439 C 486 439 486 592 506 592 L 906 592 C 914 592 916 583 916 580" class="residual"/>
  <path d="M 942 567 L 1090 567" class="line"/>
  <text x="1090" y="591" class="tiny mono" text-anchor="end">Q15 stream · d=128</text>

  <!-- MLP sublayer -->
  <text x="480" y="691" class="section">B · Power-of-two gated MLP</text>
  <rect x="480" y="713" width="636" height="208" rx="20" fill="url(#mlpFill)" stroke="#805393" class="node"/>

  <rect x="504" y="740" width="112" height="58" rx="12" fill="#231833" stroke="#7d5791"/>
  <text x="560" y="765" class="label" text-anchor="middle">Pre-norm slot</text>
  <text x="560" y="786" class="tiny" text-anchor="middle">identity today</text>

  <path d="M 616 769 L 650 769" class="line"/>
  <g>
    <rect x="650" y="728" width="118" height="54" rx="11" fill="#342044" stroke="#8b5a9d"/>
    <rect x="650" y="792" width="118" height="54" rx="11" fill="#342044" stroke="#8b5a9d"/>
    <text x="709" y="752" class="label" text-anchor="middle">Up</text>
    <text x="709" y="771" class="tiny mono" text-anchor="middle">128→256</text>
    <text x="709" y="816" class="label" text-anchor="middle">Gate</text>
    <text x="709" y="835" class="tiny mono" text-anchor="middle">128→256</text>
  </g>
  <path d="M 768 755 C 794 755 794 779 816 779" class="line-muted"/>
  <path d="M 768 819 C 794 819 794 795 816 795" class="line-muted"/>

  <rect x="816" y="748" width="136" height="78" rx="13" fill="#39234a" stroke="#8b5a9d"/>
  <text x="884" y="775" class="label" text-anchor="middle">Hard SiLU gate</text>
  <text x="884" y="799" class="small" text-anchor="middle">Up ⊙ activation(Gate)</text>

  <path d="M 952 787 L 978 787" class="line"/>
  <rect x="978" y="748" width="112" height="78" rx="13" fill="#39234a" stroke="#8b5a9d"/>
  <text x="1034" y="776" class="label" text-anchor="middle">Down</text>
  <text x="1034" y="800" class="tiny mono" text-anchor="middle">256→128</text>

  <path d="M 1034 826 L 1034 870 L 952 870" class="line"/>
  <circle cx="924" cy="870" r="18" fill="#3f3728" stroke="#f3bf63" stroke-width="1.5"/>
  <path d="M 916 870 h 16 M 924 862 v 16" stroke="#fff2cb" stroke-width="2"/>
  <path d="M 504 769 C 486 769 486 898 506 898 L 906 898 C 914 898 916 886 916 883" class="residual"/>
  <path d="M 942 870 L 1090 870" class="line"/>
  <text x="1090" y="897" class="tiny mono" text-anchor="end">block output · i16 / Q15</text>

  <g transform="translate(480 938)">
    <circle cx="7" cy="7" r="5" fill="#f3bf63"/>
    <text x="22" y="12" class="tiny">Dashed paths preserve the static-scale residual stream.</text>
    <text x="372" y="12" class="tiny">RMSNorm is the architectural target; these train-path slots currently copy their inputs.</text>
  </g>

  <!-- trunk to output -->
  <path d="M 1148 586 C 1184 586 1194 586 1230 586" class="line"/>

  <!-- Output head -->
  <g filter="url(#shadow)">
    <rect x="1230" y="334" width="280" height="326" rx="24" fill="url(#outputFill)" stroke="#3d806f" class="node"/>
  </g>
  <text x="1258" y="373" class="section">Integer output head</text>

  <rect x="1258" y="400" width="224" height="74" rx="14" fill="#123b34" stroke="#3c806f"/>
  <text x="1370" y="430" class="label" text-anchor="middle">Linear projection</text>
  <text x="1370" y="455" class="small mono" text-anchor="middle">128 → 256 logits · Q8</text>
  <path d="M 1370 474 L 1370 500" class="line"/>

  <rect x="1258" y="500" width="224" height="66" rx="14" fill="#123b34" stroke="#3c806f"/>
  <text x="1370" y="528" class="label" text-anchor="middle">Base-2 softmax</text>
  <text x="1370" y="550" class="small mono" text-anchor="middle">256 probabilities · Q15</text>
  <path d="M 1370 566 L 1370 592" class="line"/>

  <rect x="1258" y="592" width="224" height="42" rx="12" fill="#17483f" stroke="#4a9a84"/>
  <text x="1370" y="618" class="label" text-anchor="middle">Next joint-stream token</text>

  <!-- Bottom contract bar -->
  <g transform="translate(90 1012)">
    <rect width="1420" height="66" rx="18" fill="#0a1727" stroke="#293c57"/>
    <text x="24" y="27" class="tiny">NUMERIC CONTRACT</text>
    <text x="24" y="50" class="small mono">i8 weights  ·  i16 Q15 activations  ·  i32 attention logits  ·  i64 checked accumulators/state  ·  deterministic saturation + requantization</text>
    <text x="1394" y="39" class="tiny" text-anchor="end">native CPU + WASM</text>
  </g>
</svg>
