[workspace]
members = [
    "crates/nsrl-core",
    "crates/nsrl-corpus",
    "crates/nsrl-demo",
    "crates/nsrl-eval",
    "crates/nsrl-sched",
    "crates/nsrl-train-core",
    "crates/nsrl-train",
    "crates/nsrl-web-wasm",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/nsrl"

# Compute-bound integer kernels live or die on autovectorization and cross-crate
# inlining. Default release codegen (16 units, no LTO) leaves that on the floor.
[profile.release]
lto = "fat"
codegen-units = 1

# Benchmarks must reflect the same codegen as release builds.
[profile.bench]
lto = "fat"
codegen-units = 1
